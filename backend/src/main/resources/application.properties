server.port=8080

# ==========================================
# MySQL Database Configuration (Active)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/apkatiffine_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/

# ==========================================
# Paytm Payment Gateway (Live & Real Money Config)
# ==========================================
paytm.environment=SANDBOX
paytm.merchant.id=APKATIFFINE_MID_SANDBOX
paytm.merchant.key=APKATIFFINE_MKEY_SANDBOX
paytm.website=WEBSTAGING
paytm.channel.id=WEB
paytm.industry.type=Retail
paytm.merchant.vpa=paytm-apkatiffine@paytm
paytm.callback.url=http://localhost:8080/api/payment/paytm/callback

# ==========================================
# SMTP Email Notification Configuration
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notifications@apkatiffine.com
spring.mail.password=apkatiffine123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

