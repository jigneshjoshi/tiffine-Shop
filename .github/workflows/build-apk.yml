name: Build Android APK and AAB Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Web Production Assets
        working-directory: ./frontend
        run: npm run build

      - name: Install Capacitor CLI & Add Android Platform
        working-directory: ./frontend
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "APKA Tiffine Center" "com.apkatiffine.app" --web-dir "dist"
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Build Debug APK & Release AAB with Gradle
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: apkatiffine-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v3
        with:
          name: apkatiffine-playstore-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
